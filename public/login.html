<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Presensi Pintar Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    <!-- Top Glow Effect -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center mb-8 relative">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/30 mb-4">
        <i data-lucide="scan-face" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Presensi Pintar</h1>
      <p class="text-sm text-slate-400 mt-1">Masuk dengan akun pegawai atau administrator</p>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden mb-5 p-3.5 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-sm flex items-start gap-2.5">
      <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
      <span id="errorMessage">Email atau password salah.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Kantor</label>
        <div class="relative">
          <i data-lucide="mail" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="email" id="email" required placeholder="nama@absensi.local"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Kata Sandi</label>
        <div class="relative">
          <i data-lucide="lock" class="w-5 h-5 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-11 pr-11 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          <button type="button" id="togglePassword" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
        <span id="btnText">Masuk Sekarang</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

      <div class="pt-2 text-center text-xs text-slate-400">
        Belum punya akun?
        <a href="/register.html" class="text-blue-400 font-semibold hover:underline ml-1">Daftar Pegawai Baru</a>
      </div>
    </form>

    <!-- Quick Demo Accounts -->
    <div class="mt-8 pt-6 border-t border-slate-800 text-center">
      <p class="text-xs text-slate-400 mb-3 font-medium">Akun Demo Cepat (1-Klik):</p>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" onclick="quickFill('budi@absensi.local', 'karyawan123')"
          class="p-2.5 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-xs text-slate-200 transition text-left flex flex-col">
          <span class="font-semibold text-blue-400">Pegawai (Budi)</span>
          <span class="text-[11px] text-slate-400">budi@absensi.local</span>
        </button>
        <button type="button" onclick="quickFill('admin@absensi.local', 'admin123')"
          class="p-2.5 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl text-xs text-slate-200 transition text-left flex flex-col">
          <span class="font-semibold text-indigo-400">Admin HRD</span>
          <span class="text-[11px] text-slate-400">admin@absensi.local</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      const icon = document.getElementById('eyeIcon');
      icon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
      lucide.createIcons();
    });

    function quickFill(email, pwd) {
      emailInput.value = email;
      passwordInput.value = pwd;
      form.dispatchEvent(new Event('submit'));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Memverifikasi...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passwordInput.value
          })
        });

        const data = await res.json();

        if (!data.success) {
          throw new Error(data.message || 'Login gagal.');
        }

        // Simpan token dan info user di localStorage
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user_info', JSON.stringify(data.user));

        // Redirect sesuai role
        if (data.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        errorMessage.textContent = err.message;
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.textContent = 'Masuk Sekarang';
      }
    });

    // Auto-redirect jika token sudah valid
    (async () => {
      const token = localStorage.getItem('auth_token');
      if (token) {
        try {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (data.success) {
            window.location.href = data.user.role === 'admin' ? '/admin' : '/';
          }
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
