<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daftar Akun Pegawai - Presensi Pintar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    <!-- Top Glow Effect -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="text-center mb-6 relative">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/30 mb-3">
        <i data-lucide="user-plus" class="w-7 h-7"></i>
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">Daftar Akun Pegawai</h1>
      <p class="text-xs text-slate-400 mt-1">Registrasi mandiri untuk mulai absensi mobile</p>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs flex items-start gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
      <span id="errorMessage">NIP atau email sudah digunakan.</span>
    </div>

    <!-- Success Alert -->
    <div id="successAlert" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl text-xs flex items-start gap-2">
      <i data-lucide="check-circle-2" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
      <span id="successMessage">Pendaftaran berhasil! Mengalihkan...</span>
    </div>

    <!-- Register Form -->
    <form id="registerForm" class="space-y-3.5 text-xs">
      <div>
        <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1">NIP / NIK Pegawai</label>
        <div class="relative">
          <i data-lucide="badge-check" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" id="employeeId" required placeholder="Contoh: EMP004"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Nama Lengkap</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" id="fullName" required placeholder="Nama Anda"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Email</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="email" id="email" required placeholder="nama@email.com"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Kata Sandi</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="password" id="password" required placeholder="Minimal 6 karakter" minlength="6"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Jabatan</label>
          <input type="text" id="position" placeholder="Staff Operasional"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Departemen</label>
          <input type="text" id="department" placeholder="Umum"
            class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 text-xs">
        <span id="btnText">Daftar Akun Sekarang</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Sudah punya akun?
      <a href="/login.html" class="text-blue-400 font-semibold hover:underline ml-1">Masuk di sini</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('registerForm');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const successAlert = document.getElementById('successAlert');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      successAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Mendaftarkan...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            employee_id: document.getElementById('employeeId').value.trim(),
            name: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            position: document.getElementById('position').value.trim() || 'Staff',
            department: document.getElementById('department').value.trim() || 'Operasional'
          })
        });

        const data = await res.json();

        if (!data.success) {
          throw new Error(data.message || 'Pendaftaran gagal.');
        }

        // Simpan token ke localStorage
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user_info', JSON.stringify(data.user));

        successMessage.textContent = 'Pendaftaran berhasil! Mengalihkan ke perekaman biometrik wajah...';
        successAlert.classList.remove('hidden');

        // Arahkan ke rekam wajah
        setTimeout(() => {
          window.location.href = '/register-face.html';
        }, 1200);

      } catch (err) {
        errorMessage.textContent = err.message;
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.textContent = 'Daftar Akun Sekarang';
      }
    });
  </script>
</body>
</html>
